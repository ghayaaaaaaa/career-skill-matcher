[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-skill-matcher"
version = "0.1.0"
description = "Explainable matching between synthetic role skills and a user-provided skill list"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
career-match = "career_matcher.cli:main"

[tool.setuptools]
packages = ["career_matcher"]
